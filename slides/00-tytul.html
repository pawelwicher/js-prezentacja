<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Techniki optymalizacyjne w JS</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    #slide {
      justify-content: center;
      gap: 16px;
    }
    .title-tag {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      align-self: center;
    }
    .title-main {
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -.03em;
      align-self: center;
      text-align: center;
    }
    .title-sub {
      font-size: 18px;
      color: var(--muted);
      align-self: center;
      text-align: center;
    }
    .title-meta {
      display: flex;
      gap: 24px;
      align-self: center;
      margin-top: 8px;
    }
    .title-meta span {
      font-size: 13px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 14px;
      background: var(--surface);
    }
  </style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <span class="title">Optymalizacja JS — silnik V8</span>
    <img src="../assets/psei.png" alt="PSE Innowacje" style="height:28px;" />
    <span class="counter" id="counter"></span>
  </div>

  <div id="slide">
    <h1 class="title-main">Techniki<br/>optymalizacyjne<br/>w JS</h1>
    <p class="title-sub">Zarządzanie pamięcią, potok kompilacji, struktury danych dla silnika V8</p>
    <div class="title-meta">
      <span>JavaScript</span>
      <span>V8 Engine</span>
      <span>Performance</span>
    </div>
    <p class="title-sub" style="font-size:15px; margin-top:4px;">Paweł Wicher</p>
  </div>

  <div id="bottombar">
    <a class="nav-btn" id="btn-prev">← Poprzedni</a>
    <div class="dots" id="dots"></div>
    <a class="nav-btn" id="btn-next">Następny →</a>
  </div>

</div>
<script src="../nav.js"></script>
<script>initNav(0);</script>
</body>
</html>
